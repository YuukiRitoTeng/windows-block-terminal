---
name: Dependabot Patch Auto-merge

on:
    pull_request_target:
        branches:
            - main
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review

permissions:
    contents: write
    pull-requests: write

jobs:
    enable-auto-merge:
        if: >-
            github.event.pull_request.draft == false &&
            github.event.pull_request.user.login == 'dependabot[bot]' &&
            github.repository == 'YuukiRitoTeng/windows-block-terminal'
        runs-on: ubuntu-latest
        steps:
            - name: Fetch Dependabot metadata
              id: dependabot-metadata
              uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
              with:
                  github-token: ${{ github.token }}

            - name: Enable squash auto-merge for patch updates
              if: steps.dependabot-metadata.outputs.update-type == 'version-update:semver-patch'
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
              run: gh pr merge --auto --squash "$PR_URL"
